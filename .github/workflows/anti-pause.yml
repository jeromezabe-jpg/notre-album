name: Robot anti-pause Supabase

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reveiller Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' index.html)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' index.html)
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/family_name" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Reponse Supabase : $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase ne repond pas"
          exit 1

      - name: Garder le depot actif (1 fois par mois)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" -le 4 ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .robot-anti-pause.txt
            git config user.name "robot-anti-pause"
            git config user.email "robot@users.noreply.github.com"
            git add .robot-anti-pause.txt
            git commit -m "Robot anti-pause : battement mensuel" || exit 0
            git push
          fi
